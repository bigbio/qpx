<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="t d">
<title id="t">QPX architecture</title>
<desc id="d">Tool outputs are converted with qpxc convert into a QPX dataset of Parquet views (identification and quantification, spectra and evidence, proteins and modifications, metadata), plus optional HDF5 analysis matrices. Datasets are used from SQL, Python, scverse or any Parquet reader and maintained with qpxc transform or qpxc migrate. Available views depend on the input tool.</desc>
