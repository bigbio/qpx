svg { --surface:#fcfcfb;--panel:#f4f3ef;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#6f6e69;--hair:#e1e0d9;--rule:#c3c2b7;--blue:#2a78d6;--orange:#eb6834;--aqua:#1baf7a;--violet:#6250d6;--magenta:#e87ba4 }
@media (prefers-color-scheme: dark) { svg { --surface:#1a1a19;--panel:#222220;--card:#2a2a28;--ink:#f0efec;--ink2:#c3c2b7;--muted:#a3a29a;--hair:#33332f;--rule:#4a4a45;--blue:#3987e5;--orange:#d95926;--aqua:#199e70;--violet:#9085e9;--magenta:#d55181 } }
text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
.t2 { fill: var(--ink2); }
.mu { fill: var(--muted); }
.b { font-weight: 600; }
</style>
