<text x="90" y="42" font-size="16" text-anchor="start" class="t2">Tool outputs, linked Parquet views and analysis matrices</text>
<text x="24" y="67" font-size="12" text-anchor="start" class="mu">Available views depend on the input tool. Parquet stores the records; MuData gathers quantification matrices.</text>
