name: fragment
file_type: fragment_file
primary_key: [fragment_id]
identity_composite: [feature_id, label, ion_type, fragment_charge, neutral_loss, fragment_index]
doc: "Fragment-level quantities of DIA features, one row per fragment of a feature, channel and run, in specification 1.3"

fields:
  fragment_id:
    type: int64
    required: true
    nullable: false
    doc: "Opaque identity of the row, derived from the identity_composite"
  feature_id:
    type: int64
    required: true
    doc: "The feature (feature.feature_id) the fragment belongs to"
  run_file_name:
    type: string
    required: true
    doc: "Run the fragment was measured in"
  peptidoform:
    type: string
    required: true
    doc: "Peptidoform of the precursor"
  charge:
    type: int16
    required: true
    doc: "Charge of the precursor"
  label:
    type: string
    optional: true
    nullable: true
    doc: "Channel of the fragment"
  fragment_index:
    type: int32
    optional: true
    nullable: true
    doc: "1-based position in the tool's fragment list, where it names fragments by position (DIA-NN)"
  ion_type:
    type: string
    optional: true
    nullable: true
    doc: "Ion series and number, such as y8; null where the tool does not name the fragment"
  fragment_charge:
    type: int32
    optional: true
    nullable: true
    doc: "Charge of the fragment"
  neutral_loss:
    type: string
    optional: true
    nullable: true
    doc: "Neutral loss of the fragment, such as H2O; null for none"
  mz:
    type: float64
    optional: true
    nullable: true
    doc: "Theoretical m/z of the fragment"
  observed_mz:
    type: float64
    optional: true
    nullable: true
    doc: "Measured m/z of the fragment"
  intensity:
    type: float32
    minimum: 0
    optional: true
    nullable: true
    doc: "Raw quantity of the fragment; null for not measured"
  corrected_intensity:
    type: float32
    minimum: 0
    optional: true
    nullable: true
    doc: "Quantity after the tool's correction: DIA-NN Fragment.Quant.Corrected, Spectronaut F.NormalizedPeakArea"
  peak_height:
    type: float32
    minimum: 0
    optional: true
    nullable: true
    doc: "Peak height of the fragment"
  correlation:
    type: float32
    optional: true
    nullable: true
    doc: "Correlation of the fragment's elution with the precursor's other fragments"
  excluded:
    type: bool
    optional: true
    nullable: true
    doc: "Whether the tool left the fragment out of the precursor's quantity"
  rt_array:
    type: "list<float32>"
    optional: true
    nullable: true
    doc: "Retention times of the extracted ion chromatogram (seconds)"
  intensity_array:
    type: "list<float32>"
    optional: true
    nullable: true
    doc: "Intensities of the extracted ion chromatogram, parallel to rt_array"
  additional_scores:
    type: "list<score>"
    optional: true
    nullable: true
    doc: "Other per-fragment values of the tool"
