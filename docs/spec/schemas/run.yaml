name: run
file_type: run_file
primary_key: [run_file_name]
doc: "MS acquisition run metadata, one row per run"

fields:
  run_accession:
    type: string
    required: true
    doc: "Unique run identifier (SDRF assay name)"
  run_file_name:
    type: string
    required: true
    doc: "Raw data file name (without extension)"
  file_name:
    type: string
    optional: true
    doc: "Original file name with extension (e.g. S1_Frontal_1.raw)"

  # Sample-channel mapping (supports multiplexed runs)
  samples:
    type: "list<sample_channel>"
    required: true
    doc: "Sample-channel mappings with replicate info"

  # Run properties
  fraction:
    type: string
    optional: true
    doc: "Fraction identifier"

  # Instrument and method (plain strings; CV mappings in ontology.parquet)
  instrument:
    type: string
    optional: true
    doc: "Mass spectrometer name"
  enzymes:
    type: "list<string>"
    optional: true
    doc: "Proteolytic enzyme names"
  dissociation_method:
    type: string
    optional: true
    doc: "Fragmentation method name (HCD, CID, ETD)"
  acquisition_method:
    type: string
    nullable: true
    optional: true
    doc: "Data acquisition method name (e.g. DDA, DIA); from comment[proteomics data acquisition method]"

  # Additional ontology-backed run terms (acquisition method as CV, labeling, etc.);
  # plain-string values live in the fields above, resolved CV terms in ontology.parquet
  additional_terms:
    type: "list<ontology_term>"
    nullable: true
    optional: true
    doc: "Other ontology-backed run terms (acquisition method, labeling, etc.)"

  # Search configuration
  modification_parameters:
    type: "list<modification_param>"
    optional: true
    doc: "Modifications configured in database search for this run"
  label_definitions:
    type: "list<label_definition>"
    nullable: true
    optional: true
    doc: "The label modifications of each MS1 label of this run, as the SDRF declares them"
  gradient_length:
    type: float32
    nullable: true
    optional: true
    doc: "Length of the LC gradient (seconds), from comment[gradient length]"
