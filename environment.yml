name: qpx
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core
  - python>=3.10
  - click>=8.1.7
  - pandas>=2.1.3
  - numpy>=1.24.3
  - pyarrow>=14.0.1
  - pyopenms>=3.3.0,<3.5.0
  - duckdb>=1.1.3,<=1.3.0
  - pyyaml>=6.0
  # Core MuData stack (also declared in pyproject.toml)
  - anndata
  - mudata>=0.3.1
  - scipy
  # Dev / test
  - scikit-learn
  # Optional (uncomment as needed)
  # - biopython     # transforms: gene mapping
  # - mygene        # transforms: gene mapping via MyGene.info API
  # - plotly        # plotting: interactive charts
