name: Integration Tests

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of integration test to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - full-conversion-suite
          - lfq-only
          - tmt-only
          - diann-pride

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 1 hour timeout for the entire job

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-timeout
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install poetry
          # Install package in development mode
          poetry install

      - name: Run Full Conversion Suite Tests
        if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'full-conversion-suite' || github.event_name == 'release' }}
        run: |
          poetry run pytest -vv tests/core/quantms/test_full_conversion_suite.py --timeout=900
        env:
          PYTHONIOENCODING: utf-8

      - name: Run LFQ Tests Only
        if: ${{ github.event.inputs.test_type == 'lfq-only' }}
        run: |
          poetry run pytest -vv tests/core/quantms/test_full_conversion_suite.py -k "lfq" --timeout=900
        env:
          PYTHONIOENCODING: utf-8

      - name: Run TMT Tests Only
        if: ${{ github.event.inputs.test_type == 'tmt-only' }}
        run: |
          poetry run pytest -vv tests/core/quantms/test_full_conversion_suite.py -k "tmt" --timeout=900
        env:
          PYTHONIOENCODING: utf-8

      - name: Run All Integration Tests
        if: ${{ github.event.inputs.test_type == 'all' || github.event_name == 'release' }}
        run: |
          poetry run pytest -vv -m "integration" --timeout=900
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate Example Outputs
        if: ${{ github.event_name == 'release' }}
        run: |
          mkdir -p examples/output

          echo "=== QuantMS LFQ Examples ==="
          # Generate QuantMS LFQ PSM example
          poetry run python -m qpx.qpxc convert quantms-psm \
            --mztab-path tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf_openms_design_openms.mzTab.gz \
            --output-folder examples/output \
            --output-prefix quantms-lfq

          # Generate QuantMS LFQ Feature example
          poetry run python -m qpx.qpxc convert quantms-feature \
            --mztab-path tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf_openms_design_openms.mzTab.gz \
            --sdrf-file tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf.tsv \
            --msstats-file tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf_openms_design_msstats_in.csv.gz \
            --output-folder examples/output \
            --output-prefix quantms-lfq

          # Generate QuantMS LFQ Protein Groups example
          poetry run python -m qpx.qpxc convert quantms-pg \
            --mztab-path tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf_openms_design_openms.mzTab.gz \
            --sdrf-file tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf.tsv \
            --msstats-file tests/examples/quantms/dda-lfq-full/PXD007683-LFQ.sdrf_openms_design_msstats_in.csv.gz \
            --output-folder examples/output \
            --output-prefix quantms-lfq

          echo "=== DIA-NN Examples ==="
          # Generate DIA-NN Feature example
          poetry run python -m qpx.qpxc convert diann \
            --report-path tests/examples/diann/small/diann_report.tsv \
            --qvalue-threshold 0.05 \
            --mzml-info-folder tests/examples/diann/small/mzml \
            --sdrf-path tests/examples/diann/small/PXD019909-DIA.sdrf.tsv \
            --output-folder examples/output \
            --output-prefix diann \
            --duckdb-max-memory 4GB \
            --duckdb-threads 4

          # Generate DIA-NN Protein Groups example
          poetry run python -m qpx.qpxc convert diann-pg \
            --report-path tests/examples/diann/small/diann_report.tsv \
            --pg-matrix-path tests/examples/diann/small/diann_report.pg_matrix.tsv \
            --sdrf-path tests/examples/diann/small/PXD019909-DIA.sdrf.tsv \
            --output-folder examples/output \
            --output-prefix diann \
            --duckdb-max-memory 4GB \
            --duckdb-threads 4

          echo "=== MaxQuant Examples ==="
          # Generate MaxQuant PSM example
          poetry run python -m qpx.qpxc convert maxquant-psm \
            --msms-file tests/examples/maxquant/maxquant_simple/msms.txt \
            --output-folder examples/output \
            --output-prefix maxquant

          # Generate MaxQuant Feature example
          poetry run python -m qpx.qpxc convert maxquant-feature \
            --evidence-file tests/examples/maxquant/maxquant_full/evidence.txt.gz \
            --sdrf-file tests/examples/maxquant/maxquant_full/PXD001819.sdrf.tsv \
            --protein-groups-file tests/examples/maxquant/maxquant_full/proteinGroups.txt \
            --output-folder examples/output \
            --output-prefix maxquant

          # Generate MaxQuant Protein Groups example
          poetry run python -m qpx.qpxc convert maxquant-pg \
            --protein-groups-file tests/examples/maxquant/maxquant_full/proteinGroups.txt \
            --evidence-file tests/examples/maxquant/maxquant_full/evidence.txt.gz \
            --sdrf-file tests/examples/maxquant/maxquant_full/PXD001819.sdrf.tsv \
            --output-folder examples/output \
            --output-prefix maxquant

          echo "Generated example files:"
          ls -la examples/output/
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Example Outputs
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: qpx-example-outputs-${{ github.ref_name }}
          path: examples/output/
          retention-days: 90

  # DIA-NN PRIDE Parquet Integration Test
  # Tests conversion of real DIA-NN parquet files from PRIDE archive
  diann-pride-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'diann-pride' || github.event_name == 'release' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Download DIA-NN parquet from PRIDE
        run: |
          mkdir -p test_data/pride_diann
          echo "Downloading DIA-NN parquet from PRIDE (PXD068392)..."
          curl -L -o test_data/pride_diann/diann_report.parquet \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/11/PXD068392/WholeProteome_DIANNreport.parquet"
          echo "Download complete. File size:"
          ls -lh test_data/pride_diann/diann_report.parquet

      - name: Inspect parquet columns
        run: |
          echo "=== Inspecting DIA-NN parquet columns ==="
          poetry run python -c "
          import pyarrow.parquet as pq
          pf = pq.ParquetFile('test_data/pride_diann/diann_report.parquet')
          cols = [f.name for f in pf.schema_arrow]
          print(f'Total columns: {len(cols)}')
          print('Columns:', cols)

          # Check for extended columns
          from qpx.core.common import DIANN_EXTENDED_COLS, DIANN_MAP
          print()
          print('=== Core columns present ===')
          for col in DIANN_MAP.keys():
              status = '✓' if col in cols else '✗'
              print(f'  {status} {col}')

          print()
          print('=== Extended columns present ===')
          for col in DIANN_EXTENDED_COLS:
              status = '✓' if col in cols else '✗'
              print(f'  {status} {col}')
          "

      - name: Generate SDRF from parquet runs
        run: |
          echo "=== Generating minimal SDRF file ==="
          poetry run python -c "
          import pyarrow.parquet as pq

          # Read unique runs
          pf = pq.ParquetFile('test_data/pride_diann/diann_report.parquet')
          table = pf.read(columns=['Run'])
          runs = list(set(table['Run'].to_pylist()))[:10]  # Limit to 10 for testing
          print(f'Found {len(runs)} unique runs (using first 10)')

          # Create SDRF
          with open('test_data/pride_diann/test.sdrf.tsv', 'w') as f:
              f.write('source name\tcomment[data file]\tcomment[label]\tcomment[fraction identifier]\tcharacteristics[biological replicate]\n')
              for i, run in enumerate(runs):
                  run_name = run.split('.')[0] if '.' in run else run
                  f.write(f'Sample_{i+1}\t{run_name}.raw\tLFQ\t1\t1\n')

          print('SDRF created:')
          with open('test_data/pride_diann/test.sdrf.tsv') as f:
              print(f.read())
          "

      - name: Convert DIA-NN parquet to QPX feature format
        run: |
          echo "=== Converting DIA-NN parquet to QPX feature format ==="
          mkdir -p test_data/pride_diann/output

          poetry run python -m qpx.qpxc convert diann \
            --report-path test_data/pride_diann/diann_report.parquet \
            --qvalue-threshold 0.01 \
            --sdrf-path test_data/pride_diann/test.sdrf.tsv \
            --output-folder test_data/pride_diann/output \
            --output-prefix pride_diann \
            --duckdb-max-memory 4GB \
            --duckdb-threads 2 \
            --file-num 2
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate QPX output
        run: |
          echo "=== Validating QPX output ==="
          poetry run python -c "
          import pyarrow.parquet as pq
          from pathlib import Path

          output_dir = Path('test_data/pride_diann/output')
          feature_files = list(output_dir.glob('*.feature.parquet'))

          if not feature_files:
              print('ERROR: No feature files generated!')
              exit(1)

          print(f'Generated {len(feature_files)} feature files:')
          for f in feature_files:
              print(f'  - {f.name} ({f.stat().st_size / 1024:.1f} KB)')

          # Read first file and validate schema
          pf = pq.ParquetFile(feature_files[0])
          schema = pf.schema_arrow
          cols = [f.name for f in schema]

          print()
          print('=== Schema validation ===')
          required_cols = [
              'sequence', 'peptidoform', 'precursor_charge',
              'reference_file_name', 'intensities', 'additional_scores',
              'additional_intensities', 'is_decoy', 'ion_mobility'
          ]

          all_present = True
          for col in required_cols:
              status = '✓' if col in cols else '✗'
              print(f'  {status} {col}')
              if col not in cols:
                  all_present = False

          if not all_present:
              print('ERROR: Missing required columns!')
              exit(1)

          # Read sample data and check additional_scores content
          table = pf.read()
          df = table.to_pandas()

          print()
          print('=== Sample data ===')
          print(f'Total rows: {len(df)}')

          # Check additional_scores structure
          if 'additional_scores' in df.columns and len(df) > 0:
              sample_scores = df['additional_scores'].iloc[0]
              if sample_scores:
                  score_names = [s['score_name'] for s in sample_scores]
                  print(f'Score names in output: {score_names}')

                  # Verify core scores are present
                  core_scores = ['qvalue', 'pg_qvalue', 'global_qvalue']
                  for score in core_scores:
                      if score not in score_names:
                          print(f'WARNING: {score} not in additional_scores')

          # Check additional_intensities structure
          if 'additional_intensities' in df.columns and len(df) > 0:
              sample_intensities = df['additional_intensities'].iloc[0]
              if sample_intensities and len(sample_intensities) > 0:
                  intensity_names = [
                      i['intensity_name']
                      for entry in sample_intensities
                      for i in entry.get('intensities', [])
                  ]
                  print(f'Intensity names in output: {intensity_names}')

          # Check ion_mobility
          if 'ion_mobility' in df.columns:
              has_im = df['ion_mobility'].notna().any()
              print(f'Has ion mobility data: {has_im}')

          print()
          print('=== Validation PASSED ===')
          "
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload QPX output artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pride-diann-qpx-output
          path: test_data/pride_diann/output/
          retention-days: 7

  # DIA-NN Protein Groups Integration Test
  # Tests conversion of DIA-NN protein groups from PRIDE archive
  diann-pg-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'diann-pride' || github.event_name == 'release' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Download DIA-NN files from PRIDE
        run: |
          mkdir -p test_data/pride_diann_pg
          echo "Downloading DIA-NN report and pg_matrix from PRIDE (PXD068371)..."

          # Download main report
          curl -L -o test_data/pride_diann_pg/report.parquet \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/09/PXD068371/report.parquet"

          # Download protein groups matrix
          curl -L -o test_data/pride_diann_pg/report.pg_matrix.tsv \
            "https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/09/PXD068371/report.pg_matrix.tsv"

          echo "Download complete. File sizes:"
          ls -lh test_data/pride_diann_pg/

      - name: Inspect pg_matrix columns
        run: |
          echo "=== Inspecting DIA-NN pg_matrix.tsv columns ==="
          poetry run python -c "
          import pandas as pd

          # Read first few rows to get column names
          df = pd.read_csv('test_data/pride_diann_pg/report.pg_matrix.tsv', sep='\t', nrows=5)
          cols = list(df.columns)
          print(f'Total columns: {len(cols)}')
          print('First 20 columns:', cols[:20])
          print()

          # Check for expected PG columns
          from qpx.core.common import DIANN_PG_MATRIX_MAP
          print('=== Expected PG columns ===')
          for col in DIANN_PG_MATRIX_MAP.keys():
              status = '✓' if col in cols else '✗'
              print(f'  {status} {col}')

          # Count sample columns (those not in the map)
          sample_cols = [c for c in cols if c not in DIANN_PG_MATRIX_MAP.keys()]
          print(f'Sample columns: {len(sample_cols)}')
          "

      - name: Generate SDRF from pg_matrix columns
        run: |
          echo "=== Generating SDRF file from pg_matrix sample columns ==="
          poetry run python -c "
          import pandas as pd

          # Read pg_matrix header
          df = pd.read_csv('test_data/pride_diann_pg/report.pg_matrix.tsv', sep='\t', nrows=0)
          cols = list(df.columns)

          # Get sample columns (those that are not metadata columns)
          from qpx.core.common import DIANN_PG_MATRIX_MAP
          sample_cols = [c for c in cols if c not in DIANN_PG_MATRIX_MAP.keys()][:10]  # Limit to 10
          print(f'Using {len(sample_cols)} sample columns')

          # Create SDRF
          with open('test_data/pride_diann_pg/test.sdrf.tsv', 'w') as f:
              f.write('source name\tcomment[data file]\tcomment[label]\tcomment[fraction identifier]\tcharacteristics[biological replicate]\n')
              for i, col in enumerate(sample_cols):
                  # Extract run name from column (remove path and extension)
                  run_name = col.split('/')[-1].split('.')[0] if '/' in col else col.split('.')[0]
                  f.write(f'Sample_{i+1}\t{run_name}.raw\tLFQ\t1\t1\n')

          print('SDRF created:')
          with open('test_data/pride_diann_pg/test.sdrf.tsv') as f:
              print(f.read())
          "

      - name: Convert DIA-NN to QPX protein groups format
        run: |
          echo "=== Converting DIA-NN to QPX protein groups format ==="
          mkdir -p test_data/pride_diann_pg/output

          poetry run python -m qpx.qpxc convert diann-pg \
            --report-path test_data/pride_diann_pg/report.parquet \
            --pg-matrix-path test_data/pride_diann_pg/report.pg_matrix.tsv \
            --sdrf-path test_data/pride_diann_pg/test.sdrf.tsv \
            --output-folder test_data/pride_diann_pg/output \
            --output-prefix pride_diann_pg \
            --duckdb-max-memory 4GB \
            --duckdb-threads 2
        env:
          PYTHONIOENCODING: utf-8

      - name: Validate QPX protein groups output
        run: |
          echo "=== Validating QPX protein groups output ==="
          poetry run python -c "
          import pyarrow.parquet as pq
          from pathlib import Path

          output_dir = Path('test_data/pride_diann_pg/output')
          pg_files = list(output_dir.glob('*.pg.parquet'))

          if not pg_files:
              print('ERROR: No protein group files generated!')
              exit(1)

          print(f'Generated {len(pg_files)} protein group files:')
          for f in pg_files:
              print(f'  - {f.name} ({f.stat().st_size / 1024:.1f} KB)')

          # Read first file and validate schema
          pf = pq.ParquetFile(pg_files[0])
          schema = pf.schema_arrow
          cols = [f.name for f in schema]

          print()
          print('=== Schema validation ===')
          required_cols = [
              'pg_accessions', 'reference_file_name', 'intensities',
              'additional_intensities', 'is_decoy'
          ]

          all_present = True
          for col in required_cols:
              status = '✓' if col in cols else '✗'
              print(f'  {status} {col}')
              if col not in cols:
                  all_present = False

          if not all_present:
              print('ERROR: Missing required columns!')
              exit(1)

          # Read sample data
          table = pf.read()
          df = table.to_pandas()

          print()
          print('=== Sample data ===')
          print(f'Total protein groups: {len(df)}')

          # Check intensities structure
          if 'intensities' in df.columns and len(df) > 0:
              sample_intensities = df['intensities'].iloc[0]
              if sample_intensities and len(sample_intensities) > 0:
                  print(f'Intensities per protein group: {len(sample_intensities)}')
                  entry = sample_intensities[0]
                  print(f'Intensity entry keys: {list(entry.keys())}')

          # Check additional_intensities for LFQ values
          if 'additional_intensities' in df.columns and len(df) > 0:
              sample_add = df['additional_intensities'].iloc[0]
              if sample_add and len(sample_add) > 0:
                  intensity_names = [
                      i['intensity_name']
                      for entry in sample_add
                      for i in entry.get('intensities', [])
                  ]
                  print(f'Additional intensity names: {set(intensity_names)}')

          print()
          print('=== Protein Groups Validation PASSED ===')
          "
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload QPX protein groups output
        uses: actions/upload-artifact@v4
        with:
          name: pride-diann-pg-qpx-output
          path: test_data/pride_diann_pg/output/
          retention-days: 7
