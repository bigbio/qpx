# This workflow installs dependencies with uv, runs pre-commit, and tests.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]
  schedule:
    # Run pre-commit and the unit tests daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Run unit tests
        run: uv run pytest -vv -n auto -m "not integration and not large_data"

  unit-tests-prereleases:
    # Early warning of breaking releases of DuckDB and pyOpenMS, which have broken every published QPX version before.
    runs-on: ubuntu-latest
    needs: pre-commit
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Install pre-releases
        run: uv pip install --pre --upgrade duckdb pyopenms
      - name: Show versions
        run: uv run --no-sync python -c "import duckdb, pyopenms; print('duckdb', duckdb.__version__, 'pyopenms', pyopenms.__version__)"
      - name: Run unit tests on pre-releases
        run: uv run --no-sync pytest -vv -n auto -m "not integration and not large_data"

  unit-tests-duckdb-floor:
    # Exercise the declared DuckDB floor (pyproject: duckdb>=1.5.0) so the floor is
    # a real, tested contract — not just the latest resolved DuckDB. (The floor is
    # 1.5.0 because it is the first release with to_arrow_table()/to_arrow_reader()
    # on both connections and relations; DuckDB 2.0 removed the fetch_* names.) The
    # numbered_pg row-id join also uses AS MATERIALIZED so a plain CTE cannot inline.
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --extra dev
      - name: Pin DuckDB to the declared floor
        run: uv pip install "duckdb==1.5.0"
      - name: Show DuckDB version
        run: uv run --no-sync python -c "import duckdb; print('duckdb', duckdb.__version__)"
      - name: Run unit tests on the DuckDB floor
        run: uv run --no-sync pytest -vv -n auto -m "not integration and not large_data"
