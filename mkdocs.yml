site_name: qpx
site_description: Python package documentation for qpx - A tool for working with mass spectrometry data
site_author: BigBio Team

# Documentation URLs:
site_url: https://qpx.quantms.org/

repo_name: bigbio/qpx
repo_url: https://github.com/bigbio/qpx
# dev_addr: 127.0.0.1:8000

theme:
  name: material
  favicon: images/favicon.svg
  font: false
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
extra_css:
  - stylesheets/quantms-theme.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - abbr
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 2

plugins:
  - search:
      lang:
        - en
  - markdown-exec

nav:
  - Introduction:
      - Home: index.md
      - Quick Start: quickstart.md
      - Examples:
          - Overview: examples/index.md
          - Quick Start: examples/quickstart.md
          - Workflows: examples/workflows.md
          - Integration: examples/integration.md
          - QC: examples/qc.md
      - Community: community.md
  - Specification:
      - Overview: spec/index.md
      - Common Concepts:
          - Peptidoform: spec/peptidoform.md
          - Modifications: spec/modifications.md
          - Intensities: spec/intensities.md
          - Scores & CV Terms: spec/scores.md
          - Scan Numbers: spec/scan.md
      - Data Views:
          - PSM: spec/psm.md
          - Feature: spec/feature.md
          - Protein Group: spec/pg.md
          - Mass Spectra: spec/mz.md
          - Peptide-Protein Map: spec/pepmap.md
          - API Views: spec/views.md
      - Expression Views:
          - AnnData Concepts: spec/anndata.md
          - Absolute Expression: spec/absolute.md
          - Differential Expression: spec/differential.md
      - Metadata:
          - Dataset: spec/dataset.md
          - Sample: spec/sample.md
          - Run: spec/run.md
          - Provenance: spec/provenance.md
          - SDRF Mapping: spec/sdrf-mapping.md
      - Technical:
          - Serialization & Parquet: spec/serialization.md
          - File Naming: spec/file-naming.md
          - Versioning: spec/versioning.md
          - Tool Mappings: spec/tool-mappings.md
          - Schemas: spec/schemas.md
          - Ontology Mapping: spec/ontology.md
  - API:
      - CLI Overview: guide/index.md
      - Query: guide/query.md
      - Info: guide/info.md
      - Validate: guide/validate.md
      - Statistics: guide/stats.md
      - Project Management: guide/project.md
      - Troubleshooting: troubleshooting.md
  - Tools:
      - Converters: guide/convert.md
      - Transforms: guide/transform.md
      - Ontology: guide/ontology.md
      - Visualization: guide/visualize.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bigbio/qpx
      name: GitHub Repository
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/qpx/
      name: PyPI Package
    - icon: fontawesome/solid/bug
      link: https://github.com/bigbio/qpx/issues
      name: Report Issues
    - icon: fontawesome/solid/book
      link: https://github.com/bigbio/qpx/blob/main/README.md
      name: Documentation
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve by
            <a href="https://github.com/bigbio/qpx/issues" target="_blank" rel="noopener">opening an issue</a>.

copyright: Copyright &copy; 2024-2026 BigBio Team
