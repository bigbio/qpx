# PEP 621 project metadata (used by uv, pip, and other standard tools)
[project]
name = "qpx"
dynamic = ["version"]
description = "Quantitative proteomics data toolkit — convert, transform, query, and validate QPX Parquet datasets"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "BigBio Team", email = "ypriverol@gmail.com" }]
keywords = ["python", "multiomics", "proteomics", "quantms", "reanalysis", "parquet", "proteomics-data", "standardized-format", "bioinformatics-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "click>=8.1",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "pyopenms>=3.3.0,<4.0.0",
    "numpy>=1.24",
    "duckdb>=1.3.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
    # Canonical channel-label vocabulary (TMT/iTRAQ/SILAC/mTRAQ + synonyms) —
    # single source of truth shared with the OpenMS/DIA-NN SDRF converters.
    "sdrf-pipelines>=0.1.6",
    # Floor at 0.3.1: mudata 0.3.0 breaks against anndata>=0.10.9 (private API).
    "mudata>=0.3.1",
    "anndata>=0.9.0",
    "scipy>=1.10",
]
[project.optional-dependencies]
mzidentml = ["lxml>=4.9.0"]
pdc = ["pridepy>=0.0.15"]
transforms = ["biopython", "mygene>=1.0.0"]
plotting = ["plotly>=5.0.0", "scikit-learn>=1.5.0"]
quantify = ["mokume[directlfq]>=0.1.0"]
all = ["lxml>=4.9.0", "biopython", "mygene>=1.0.0", "plotly>=5.0.0", "scikit-learn>=1.5.0", "mokume[directlfq]>=0.1.0"]
dev = [
    "pytest",
    "pytest-timeout",
    "hypothesis",
    "lxml>=4.9.0",
    "scikit-learn",
    "plotly>=5.0.0",
    "pre-commit",
    "ruff",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "markdown-exec[ansi]>=1.11.0",
]

[project.scripts]
qpxc = "qpx.cli.main:main"

[project.urls]
Homepage = "https://quantms.org"
Documentation = "https://qpx.quantms.org"
Repository = "https://github.com/bigbio/qpx"
"Bug Tracker" = "https://github.com/bigbio/qpx/issues"
Changelog = "https://github.com/bigbio/qpx/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.targets.sdist]
exclude = ["tests/examples"]

[tool.hatch.build.targets.wheel]
packages = ["qpx"]
force-include = { "LICENSE" = "LICENSE" }

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "E402"]
"qpx/converters/base.py" = ["ARG002"]

[tool.bandit]
# Converter SQL interpolates *column names* (SQL identifiers, which cannot be
# bound as parameters) from controlled resolve_columns() maps and literal column
# constants, with identifier quoting -- never user input. B608 is a false
# positive for this dynamic-identifier SQL construction.
skips = ["B608"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "large_data: marks tests as requiring large data files (deselect with '-m \"not large_data\"')",
]
