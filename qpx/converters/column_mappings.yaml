# Central column-mapping registry for all supported tools.
# Each QPX field maps to an ordered list of candidate column names;
# the first match against actual input columns wins (see resolve_columns()).

fragpipe:
  tool_name: "FragPipe"
  tool_versions: "20+"
  rt_unit: "second"
  column_mapping:
    feature:
      sequence: ["Peptide Sequence"]
      modified_sequence: ["Modified Sequence", "Modified Peptide"]
      pg_accessions: ["Protein", "Protein ID"]
      gg_names: ["Gene"]
      observed_mz: ["M/Z"]
      charge: ["Charge"]
      compensation_voltage: ["Compensation Voltage"]
      modifications: ["Assigned Modifications"]
    psm:
      sequence: ["Peptide"]
      modified_sequence: ["Modified Peptide"]
      charge: ["Charge"]
      observed_mz: ["Observed M/Z"]
      calculated_mz: ["Calculated M/Z"]
      rt: ["Retention"]
      pg_accessions: ["Protein"]
    pg:
      pg_accessions: ["Protein", "Protein ID"]
      gg_accessions: ["Gene", "Gene Names"]
      pg_names: ["Description", "Protein Description"]
      # Real FDR/Q-Value columns first (low = best); "Protein Probability" is a
      # confidence score (~1.0 = best) and must only be a last-resort fallback,
      # converted as 1 - probability by the adapter — never used raw as a q-value.
      pg_qvalue: ["Protein FDR", "Protein Q-Value", "Combined Protein FDR", "Protein Probability"]
      peptide_count_total: ["Combined Total Peptides", "Total Peptides"]
      peptide_count_unique: ["Combined Unique Peptides", "Unique Peptides"]
      spectral_count: ["Combined Spectral Count", "Spectral Count"]
      sequence_coverage: ["Percent Coverage", "Coverage"]
      molecular_weight: ["Protein Molecular Weight (Da)"]

