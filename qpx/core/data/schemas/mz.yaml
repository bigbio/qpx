name: mz
file_type: mz_file
primary_key: [id]
doc: "Mass spectrometry spectral data (scan-level)"

fields:
  # Scan identification
  id:
    type: string
    required: true
    doc: "Unique scan/spectrum identifier"
  run_file_name:
    type: string
    optional: true
    doc: "Run file containing this spectrum (links to PSM/feature run_file_name)"
  scan:
    type: "list<int32>"
    optional: true
    doc: "Scan ID from native ID (array of int components; links to PSM/feature scan)"
  ms_level:
    type: int32
    required: true
    doc: "MS level (1=MS1, 2=MS2)"
  centroid:
    type: bool
    required: true
    doc: "Centroided (true) or profile (false)"

  # Timing and mobility
  scan_start_time:
    type: float32
    required: true
    doc: "Scan start time (minutes)"
  inverse_ion_mobility:
    type: float32
    optional: true
    doc: "Inverse ion mobility (TIMS)"
  drift_time:
    type: float32
    optional: true
    doc: "Ion mobility drift time in milliseconds (MS:1002476), for drift-tube and travelling-wave instruments"
  compensation_voltage:
    type: float32
    optional: true
    doc: "FAIMS compensation voltage in volts (MS:1001581)"
  ion_injection_time:
    type: float32
    optional: true
    doc: "Ion injection time (ms); null when the source does not record it"
  total_ion_current:
    type: float32
    required: true
    doc: "Total ion current"

  # Precursor info (MS2+ only)
  precursors:
    type: "list<precursor>"
    optional: true
    doc: "Precursor ions"

  # Spectral data
  mz:
    type: "list<float32>"
    required: true
    doc: "m/z values"
  intensity:
    type: "list<float32>"
    required: true
    doc: "Intensity values"
  ion_mobility_array:
    type: "list<float32>"
    optional: true
    doc: "Ion mobility of each peak, for a spectrum whose peaks span a mobility range"
  ion_mobility_array_unit:
    type: string
    optional: true
    doc: "Unit of ion_mobility_array: 'Vs/cm^2' (1/K0) or 'ms' (drift time)"

  # Metadata
  cv_params:
    type: "list<cv_param>"
    optional: true
    doc: "CV parameters"
