name: psm
file_type: psm_file
primary_key: [psm_id]
identity_composite: [run_file_name, scan, peptidoform, charge]
doc: "Peptide Spectrum Matches from identification searches"

fields:
  # Identity
  psm_id:
    type: int64
    required: true
    nullable: false
    doc: "Opaque identity of the psm (int64), supplied by the producer or derived from the identity_composite declared in the footer; the primary key of this view."

  # Core identification (shared with Feature)
  sequence:
    type: string
    required: true
    doc: "Unmodified peptide sequence"
  peptidoform:
    type: string
    required: true
    doc: "ProForma notation"
  modifications:
    type: "list<modification>"
    doc: "Structured modifications"
  # Competing modification interpretations (optional)
  modification_candidates:
    type: "list<modification_candidate>"
    optional: true
    nullable: true
    doc: "Every modification the evidence considers, the ones the peptidoform places (assigned) and the ones they compete with, each with its marginal probability given this identification. Candidates that share an alternative_group are mutually exclusive explanations of one event (acetyl or trimethyl on one Lys; one phosphate on S4 or T5) and their probabilities sum to at most 1; a candidate without a group can co-occur with others (a SILAC label and an acetyl on one Lys). Null when the producer reports no alternatives; modifications keeps what the peptidoform says."
  charge:
    type: int16
    required: true
    doc: "Precursor charge"
  posterior_error_probability:
    type: float64
    minimum: 0
    maximum: 1
    doc: "PEP - probability PSM is incorrect (lower is better)"
  is_decoy:
    type: bool
    required: true
    doc: "Decoy match flag; false when the identification did not use a target-decoy database search"
  calculated_mz:
    type: float32
    required: true
    nullable: true
    doc: "Theoretical m/z; null when it cannot be calculated from the reported peptidoform"
  observed_mz:
    type: float32
    required: true
    nullable: true
    doc: "Experimental m/z; null when the producer reports no measured precursor m/z"
  mass_error_ppm:
    type: float32
    doc: "Mass error in ppm: 1e6 * (observed_mz - calculated_mz) / calculated_mz"
  additional_scores:
    type: "list<score>"
    doc: "Search engine scores"
  qvalue:
    type: float64
    minimum: 0
    maximum: 1
    nullable: true
    optional: true
    doc: "PSM-level q-value, filled from additional_scores at write time (scores.md); null when the source has none"
  predicted_rt:
    type: float32
    doc: "Predicted RT (seconds)"
  run_file_name:
    type: string
    required: true
    doc: "Run file containing this PSM"
  cv_params:
    type: "list<cv_param>"
    doc: "CV parameters"
  scan:
    type: "list<int32>"
    required: true
    doc: "Scan ID (array of int components)"
  rt:
    type: float32
    doc: "Retention time (seconds)"
  ion_mobility:
    type: float32
    optional: true
    doc: "Ion mobility"
  missed_cleavages:
    type: int16
    doc: "Number of missed enzymatic cleavages (MS:1003044)"

  # PSM-specific fields
  protein_accessions:
    type: "list<string>"
    doc: "Protein accessions the peptide maps to"

  # Cross-linking (XL-MS)
  cross_links:
    type: "list<cross_link>"
    optional: true
    doc: "Cross-link information for XL-MS experiments"
  pass_threshold:
    type: "bool"
    optional: true
    doc: "Whether the search engine or validator marks the PSM as passing its threshold"

  # Spectral data (optional - may be stored in mz.parquet instead)
  mz_array:
    type: "list<float32>"
    optional: true
    doc: "Spectrum m/z values"
  intensity_array:
    type: "list<float32>"
    optional: true
    doc: "Spectrum intensity values"
  charge_array:
    type: "list<int32>"
    optional: true
    doc: "Fragment charge values"
  ion_type_array:
    type: "list<string>"
    optional: true
    doc: "Fragment ion type annotations (e.g., b1, y2, a2)"
  ion_mobility_array:
    type: "list<float32>"
    optional: true
    doc: "Fragment ion mobility values"

  label:
    type: string
    optional: true
    nullable: true
    doc: "MS1-labelled experiments (SILAC, dimethyl, mTRAQ): the channel label of the identified precursor, whose label modifications the peptidoform carries. Null otherwise."

  # Optional cross-reference
  feature_id:
    type: int64
    optional: true
    nullable: true
    doc: "Optional reference to the feature this PSM maps to (feature.feature_id); null when unlinked."
