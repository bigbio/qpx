name: feature
file_type: feature_file
primary_key: [feature_id]
identity_composite: [peptidoform, charge, run_file_name, rt]
doc: "Quantified peptide features with a mandatory opaque feature_id and a footer-declared producer identity composite"

fields:
  # Identity
  feature_id:
    type: int64
    required: true
    nullable: false
    doc: "Opaque identity of the feature (int64), supplied by the producer or derived from the identity_composite declared in the footer; the primary key of this view."

  # Core identification
  sequence:
    type: string
    required: true
    doc: "Unmodified peptide sequence"
  peptidoform:
    type: string
    required: true
    doc: "ProForma notation"
  modifications:
    type: "list<modification>"
    doc: "Structured modifications"
  charge:
    type: int16
    required: true
    doc: "Charge state"
  posterior_error_probability:
    type: float64
    doc: "PEP for the peptide match"
  peptide_qvalue:
    type: float64
    nullable: true
    optional: true
    doc: "Peptide-level q-value; null/absent when the search engine does not provide one"
  is_decoy:
    type: bool
    required: true
    doc: "Decoy flag; false when the identification did not use a target-decoy database search"
  calculated_mz:
    type: float32
    required: true
    nullable: true
    doc: "Theoretical m/z; null when it cannot be calculated from the reported peptidoform"
  observed_mz:
    type: float32
    required: true
    nullable: true
    doc: "Experimental m/z; null when the producer reports no measured precursor m/z (e.g. DIA-NN report without Precursor.Mz and no ms_info)"
  mass_error_ppm:
    type: float32
    doc: "Mass error in ppm: 1e6 * (observed_mz - calculated_mz) / calculated_mz"
  additional_scores:
    type: "list<score>"
    doc: "Search engine scores"
  predicted_rt:
    type: float32
    doc: "Predicted RT (seconds)"
  run_file_name:
    type: string
    required: true
    doc: "Run file name"
  quantification_unit_id:
    type: string
    nullable: true
    optional: true
    doc: "Producer-reported or QPX-mapped quantification unit; used when one quantity can aggregate multiple raw runs"
  cv_params:
    type: "list<cv_param>"
    doc: "CV parameters"
  scan:
    type: "list<int32>"
    required: true
    doc: "Scan ID (array of int components)"
  rt:
    type: float32
    nullable: true
    doc: "Retention time (seconds); may participate in a producer-specific identity composite when it identifies the upstream Feature entity"
  consensus_rt:
    type: float32
    nullable: true
    optional: true
    doc: "Parent ConsensusFeature retention time; populated by the OpenMS consensusXML converter"
  ion_mobility:
    type: float32
    doc: "Ion mobility"
  compensation_voltage:
    type: float32
    nullable: true
    optional: true
    doc: "FAIMS compensation voltage; 0 for a producer's non-FAIMS quantification unit when used in its identity composite"
  missed_cleavages:
    type: int16
    doc: "Number of missed enzymatic cleavages (MS:1003044)"

  # Quantification
  intensities:
    type: "list<intensity>"
    doc: "Primary intensities per label"
  additional_intensities:
    type: "list<additional_intensity>"
    doc: "Tool-provided intensities (normalized, LFQ, iBAQ) read from upstream output"

  # Protein mapping
  pg_accessions:
    type: "list<pg_protein>"
    doc: "Full membership of the peptide's protein group, with optional peptide positions (start, end). Null under the same conditions as anchor_protein."
  anchor_protein:
    type: string
    required: true
    nullable: true
    doc: "Representative protein of the peptide's protein group. Null when no protein mapping was performed, or when the peptide's protein evidence spans more than one inferred protein group (a shared peptide the producer did not assign); the feature's intensities are kept either way."
  unique:
    type: bool
    doc: "True when the peptide resolves to a protein group of exactly one protein, False when that group has several members. Null when the group is unresolved, including a shared peptide whose evidence spans more than one inferred group."
  pg_global_qvalue:
    type: float64
    optional: true
    doc: "Global q-value of PG"
  pg_positions:
    type: "list<protein_position>"
    optional: true
    doc: "Peptide positions"

  # Ion mobility window
  ion_mobility_start:
    type: float32
    doc: "Start ion mobility"
  ion_mobility_stop:
    type: float32
    doc: "Stop ion mobility"

  # Gene annotations
  gg_accessions:
    type: "list<string>"
    optional: true
    doc: "Gene group identifiers (gene symbols; Ensembl IDs when available)"
  gg_names:
    type: "list<string>"
    optional: true
    doc: "Gene group names (gene symbols from tool output)"

  # Spectra reference
  id_run_file_name:
    type: string
    doc: "Run file containing best PSM"
  rt_start:
    type: float32
    doc: "RT window start"
  rt_stop:
    type: float32
    doc: "RT window end"

  # Optional cross-references
  psm_ids:
    type: "list<int64>"
    optional: true
    nullable: true
    doc: >-
      Optional producer-supplied hardlink to the psm rows this feature maps to
      (list of psm_id). NOT materialized by qpx's own converters — when absent
      (null), use the computed inverse softlink: Dataset.link_feature_psm(), the
      inverse of the authoritative psm.feature_id foreign key (group by feature_id
      to recover this list, bigbio/qpx#267). See docs/spec/psm.md -> feature_id.
  pg_ids:
    type: "list<int64>"
    optional: true
    nullable: true
    doc: >-
      Optional producer-supplied hardlink to the pg rows this feature maps to
      (list of pg_id). NOT materialized by qpx's own converters — when absent
      (null), use the computed softlink: Dataset.link_feature_pg(), a label-aware
      read-side join of feature and pg on canonical(pg_accessions) +
      run_file_name in pg.grouped_runs + label in feature.intensities
      (bigbio/qpx#269). See docs/spec/pg.md -> Protein group semantics.
