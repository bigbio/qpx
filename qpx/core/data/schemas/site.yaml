name: site
file_type: site_file
primary_key: [site_id]
identity_composite: [protein_accession, position, modification_name, grouped_runs, label]
doc: "Protein modification sites: one row per claim that a residue of a protein carries a given modification (protein, position, modification, runs), with a q-value over those claims, the probability that the residue is modified, and the share of the residue's modification evidence that supports this modification"

fields:
  # Identity
  site_id:
    type: int64
    required: true
    nullable: false
    doc: "Opaque identity of the site (int64), supplied by the producer or derived from the identity_composite declared in the footer; the primary key of this view."

  # Site
  protein_accession:
    type: string
    required: true
    doc: "Accession of the protein the position refers to"
  family:
    type: string
    nullable: true
    doc: "Protein family the protein belongs to (the canonical entry of an isoform, variant or chain); equal to protein_accession for a canonical entry"
  position:
    type: int32
    required: true
    doc: "Position in the protein, with the psm.modifications convention: 1-based for a residue (its side chain), 0 for the protein N-terminus and protein length + 1 for the protein C-terminus. N-terminal acetylation of Met1 is position 0; acetylation of a Lys1 side chain is position 1."
  amino_acid:
    type: string
    required: true
    nullable: true
    doc: "Residue at the position (one letter); null for a protein terminus (position 0 or length + 1)"
  modification_name:
    type: string
    required: true
    doc: "Modification name (e.g. Phospho, Acetyl)"
  modification_accession:
    type: string
    nullable: true
    doc: "Modification accession (e.g. UNIMOD:21)"
  mass_delta:
    type: float64
    required: true
    doc: "Monoisotopic mass shift of the modification (Da). Not part of the identity: modifications of equal mass (e.g. dimethyl and ethyl) are distinct rows, told apart by modification_name."

  # Context
  grouped_runs:
    type: "list<string>"
    required: true
    doc: "Runs whose PSMs support the site (all runs of the dataset for a dataset-level estimate)"
  pg_id:
    type: int64
    nullable: true
    doc: "The protein group (pg.pg_id) that holds the protein, for the same grouped_runs: the pg row with a null label (identification) when one exists. Null when the site spans several pg rows (several labels, or runs grouped differently in pg); join through pg_accessions membership then."
  prior_evidence:
    type: string
    nullable: true
    doc: "Where the claim comes from before the search, e.g. curated (reviewed annotation), catalogue, sample (the sample's own calls), or null for a site found without a prior. An open vocabulary: producers name their own evidence classes."

  # Error control and probabilities
  site_qvalue:
    type: float64
    minimum: 0
    maximum: 1
    nullable: true
    doc: "q-value over the site-modification claims of this view: the estimated proportion of false claims among the rows at least as well supported. A claim is false when the residue does not carry this modification in the sample, whatever the reason (wrong peptide, wrong protein, wrong residue, wrong modification). The counting unit is the distinct row (protein, position, modification, grouped_runs), not the PSM. A set-level statistic, not the probability that this row is correct. Null when the producer has no estimate at this unit; the method and the population it was estimated over belong in provenance."
  modified_probability:
    type: float64
    minimum: 0
    maximum: 1
    nullable: true
    doc: "Probability that the residue carries some modification, from the spectra of the peptides that cover it. Not stoichiometry (the fraction of the protein's copies that are modified), which this view does not report."
  evidence_fraction:
    type: float64
    minimum: 0
    maximum: 1
    nullable: true
    doc: "Share of the residue's modification evidence that supports this modification: each spectrum's explanations (the candidate peptidoforms of that spectrum) are mutually exclusive and get posterior probabilities; the probability mass that places a modification on the residue is summed over spectra, and this is the part placing this modification. Together with the alternatives it sums to 1; a row without alternatives holds the whole pool, so its fraction is 1. A relative share, not the probability that the modification is present: two modifications that both occur on the residue (on different molecules or in different runs) are two rows, each with its own site_qvalue, and can each have a fraction near 0.5."
  alternatives:
    type: "list<site_alternative>"
    nullable: true
    doc: "The other modifications the same evidence places on the residue, with their evidence fractions, largest first (e.g. trimethyl 0.29 beside acetyl 0.71)"

  # Evidence
  psm_count:
    type: int32
    nullable: true
    doc: "PSMs passing the PSM-level cutoff that place the modification at the residue"
  best_psm_id:
    type: int64
    nullable: true
    doc: "The best of those PSMs (psm.psm_id)"
  is_decoy:
    type: bool
    required: true
    doc: "Decoy or knockoff site, written when a reader should be able to recompute site_qvalue"

  # Quantification
  label:
    type: string
    optional: true
    nullable: true
    doc: "Channel of this quantification; null for a claim without one. Part of the identity composite"
  intensity:
    type: float32
    minimum: 0
    optional: true
    nullable: true
    doc: "Quantity of the modified site in this label and these runs"
  stoichiometry:
    type: float64
    minimum: 0
    maximum: 1
    optional: true
    nullable: true
    doc: "Fraction of the protein's copies at this residue that carry the modification, in this label and these runs (MaxQuant Occupancy)"
  # Scores and metadata
  additional_scores:
    type: "list<score>"
    doc: "Additional scores (e.g. a localization probability)"
  cv_params:
    type: "list<cv_param>"
    doc: "CV parameters"
